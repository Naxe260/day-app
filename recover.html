<!doctype html><html lang=ru><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Восстановление данных</title></head>
<body style="font-family:-apple-system,system-ui,sans-serif;padding:18px;background:#FAF5EF;color:#3B2A31">
<h3>Резервная копия «День»</h3>
<p id=info>Читаю память…</p>
<textarea id=t style="width:100%;height:55vh;font-size:12px;border:1px solid #EADFD8;border-radius:10px;padding:10px"></textarea>
<button id=b style="margin-top:12px;padding:14px 18px;border:0;border-radius:12px;background:#5C2B3D;color:#fff;font-size:16px">Скопировать всё</button>
<script>
(function(){
 var out="",info=document.getElementById("info");
 try{
  var keys=["azarova-state-v2","azarova-state","day-state"],found=null,fk="";
  for(var i=0;i<keys.length;i++){var v=localStorage.getItem(keys[i]);if(v){found=v;fk=keys[i];break;}}
  if(!found){ // на всякий случай — любой ключ с данными
    for(var j=0;j<localStorage.length;j++){var k=localStorage.key(j);var val=localStorage.getItem(k);if(val&&val.length>found?0:0){}}
  }
  if(found){
   var d=JSON.parse(found);
   var t=d.tasks||{},nt=0;for(var x in t){if(t[x]&&t[x].length)nt+=t[x].length;}
   var pay=(d.finance&&d.finance.payments)?d.finance.payments.length:0;
   info.textContent="Нашла данные ("+fk+"): задач "+nt+", платежей "+pay+". Скопируй текст ниже и пришли мне в чат.";
   out=found;
  } else {
   info.textContent="В этом хранилище данных не найдено. Возможно, приложение открыто из другого места — напиши мне.";
  }
 }catch(e){info.textContent="Ошибка чтения: "+e;}
 document.getElementById("t").value=out;
 document.getElementById("b").onclick=function(){
   var ta=document.getElementById("t");ta.select();
   try{navigator.clipboard.writeText(ta.value).then(function(){info.textContent="Скопировано! Вставь в чат мне.";},function(){document.execCommand("copy");});}
   catch(e){document.execCommand("copy");}
 };
})();
</script></body></html>
